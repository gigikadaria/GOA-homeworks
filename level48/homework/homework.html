<!DOCTYPE html>
<html>
<head>
    <title>Box Model & Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<!--
Box Model არის CSS-ის მოდელი, რომელიც აღწერს ელემენტის სტრუქტურას.
1) Content
ეს არის ელემენტის შიგთავსი

2) Padding
Content-სა და Border-ს შორის სივრცე.
ზრდის ელემენტის შიდა ზომას.

3) Border
ელემენტის ჩარჩო.

4) Margin
ელემენტსა და სხვა ელემენტებს შორის დაშორება.  
Content → Padding → Border → Margin
-->

<!-- 3) WEBSITE -->
<h1>My Simple Website</h1>

<div class="card">
    <h2>About Me</h2>
    <p>I like programming and learning new things.</p>
</div>

<div class="card">
    <h2>My Skills</h2>
    <p>HTML, CSS, Python</p>
</div>

<div class="card">
    <h2>Contact</h2>
    <p>Email: example@gmail.com</p>
</div>


<h2>Margin & Padding Examples</h2>

<div class="box1">Box 1 (margin 20px, padding 20px)</div>
<div class="box2">Box 2 (margin 50px, padding 10px)</div>

<!--
5) დამატებითი ინფორმაცია

Box Model მნიშვნელოვანია რადგან:
- აკონტროლებს ელემენტის ზომას
- ეხმარება layout-ის სწორად აგებაში
- იცავს ელემენტებს ერთმანეთთან შეჯახებისგან

ფორმულა:
Total Size = Content + Padding + Border + Margin
-->

</body>
</html>
