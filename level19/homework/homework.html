<html>
<head>
    <title>Video დავალება</title>
</head>
<body>

<h2>Video და Audio თეგები</h2>

<!-- video აჩვენებს ვიდეოს -->
<!-- audio აჩვენებს ხმას -->
<!-- source მიუთითებს ფაილს -->
<!-- type ეუბნება ბრაუზერს ფაილის ტიპს -->

<video width="300" controls>
    <source src="./7565438-hd_1080_1920_25fps.mp4" type="video/mp4">
</video>

<br><br>

<audio controls>
    <source src="./file_example_MP3_700KB.mp3" type="audio/mp3">
</audio>

<hr>

<h2>ვიდეო ღილაკებით</h2>

<!-- controls აძლევს მომხმარებელს ვიდეოს მართვის საშუალებას -->

<video width="400" controls>
    <source src="./6394054-uhd_4096_2048_24fps.mp4" type="video/mp4">
</video>

<hr>

<h2>ჩემი საყვარელი მანქანა</h2>
<p>BMW M5</p>

<!-- ვიდეო იწყება თავისით, არის ჩუმად და მეორდება -->

<video
    src="./5951267-uhd_4096_2160_25fps.mp4"
    autoplay
    muted
    loop
    width="450">
</video>

<hr>

<!-- დავალებაში ეს ნაწილი მხოლოდ ვიდეოს ყურებას ეხება -->

</body>
</html>
