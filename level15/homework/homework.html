<html>
<head>
<title>Registration & Input Test</title>
</head>
<body>


<!-- 2) Registration Form -->
<h2>სარეგისტრაციო ფორმა</h2>
<form>
<label for="fullname">სახელი და გვარი:</label>
<input type="text" id="fullname" name="fullname" placeholder="გთხოვთ შეიყვანოთ სახელი"><br>


<label for="email">ემაილი:</label>
<input type="email" id="email" name="email" placeholder="example@mail.com"><br>


<label for="password">პაროლი:</label>
<input type="password" id="password" name="password" placeholder="შეიყვანეთ პაროლი"><br>


<input type="submit" value="რეგისტრაცია"><br>
</form>




<!-- 3) Testing all input types -->
<h2>Input Types Test</h2>
<form>
<label for="text">Text:</label>
<input type="text" id="text" name="text"><br>


<label for="password2">Password:</label>
<input type="password" id="password2" name="password2"><br>


<label for="email2">Email:</label>
<input type="email" id="email2" name="email2"><br>


<label for="number">Number:</label>
<input type="number" id="number" name="number"><br>


<label for="date">Date:</label>
<input type="date" id="date" name="date"><br>


<label for="tel">Telephone:</label>
<input type="tel" id="tel" name="tel"><br>


<label for="url">URL:</label>
<input type="url" id="url" name="url"><br>


<label for="color">Color:</label>
<input type="color" id="color" name="color"><br>


<label for="range">Range:</label>
<input type="range" id="range" name="range"><br>


<label for="checkbox">Checkbox:</label>
<input type="checkbox" id="checkbox" name="checkbox"><br>


<label for="radio1">Radio 1:</label>
<input type="radio" id="radio1" name="radioGroup">
<label for="radio2">Radio 2:</label>
<input type="radio" id="radio2" name="radioGroup"><br>


<label for="file">File:</label>
<input type="file" id="file" name="file"><br>


<input type="submit" id="submit2" value="Send"><br>
</form>


</body>
</html>
