<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Base Apparel coming soon page</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    
    <section class="content-side">
      
      <div class="logo-container">
        <img src="./images/logo.svg" alt="Base Apparel Logo" class="logo">
      </div>

      <div class="hero-mobile">
        <img src="./images/hero-mobile.jpg" alt="Hero banner">
      </div>

      <div class="text-content">
        <h1><span class="light-text">We're</span> coming soon</h1>
        <p>Hello fellow shoppers! We're currently building our new fashion store. Sign up below to stay updated with the latest stories and upcoming collections.</p>
        
        <form class="email-form">
          <div class="input-container">
            <input type="email" placeholder="Email Address" required>
            <button type="submit" aria-label="Submit">
              <img src="./images/icon-arrow.svg" alt="">
            </button>
          </div>
        </form>
      </div>
      
    </section>

    <section class="image-side"></section>

  </main>
</body>
</html>
