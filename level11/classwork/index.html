<html>
  <head>
    <title>HyperLinks</title>
  </head>

  <body>
    <a href="./main.html" target="_blank">This is my First HyperLink</a>

    <ol>
      <li>Go for a walk</li>
      <li>Do my homework</li>
    </ol>

    <ul>
      <li>Go for a walk</li>
      <li>Go to school</li>
      <li>Do my homework</li>
    </ul>

  </body>
</html>

<!-- 

HyperLink -- ლინკები, გამოიყენება ვებ-საიტებზე და გვეხმარება ერთი საინფორმაციო წყაროდან მეორე წყაროზე გადასვლაში.

<a></a> - თეგი, რომელიც გამოიყენება იმისთვის რომ ვებ-საიტებზე შემოვიტანოთ hyperLink-ები.

href - ატრიბუტი, რომელიც გამოიყენება HyperLink-ებისთვის, რომელშიც გადავცემთ ლინკის წყაროს, ხოლო თვითონ ატრიბუტი კი იწერება თეგის გამხსნელ ნაწილში.

ol - ordered list - თეგი, რომლის დახმარებითაც შეგვიძლია შევქმნათ დალაგებული სია. (ყველაფერი დანომრილია)

ul - unordered list - თეგი, რომლის დახმარებითაც შეგვიძლია შევქმნათ დაულაგებელი სია. (ყველაფერი გამოსახულია round bullet-ბის მეშვეობით)

li - list item - თეგი, რომლის დახმარებითაც შეგვიძლია შევქმნათ სიებში ახალი მნიშვნელობები.

ჩვენ შეგვიძლია დავაკავშიროთ ჩვენივე მიერ გამზადებული 2 ცალი html-ის ფაილი ერთმანეთში, მთავარია href ატრიბუტში სწორად მივუთითოთ წყარო. ვიწყებთ ./-ით და შემდეგ გიგდებთ შესაძლო ვარიანტებს.

target - ატრიბუტი, რომელიც გამოიყენება HyperLink-ებისთვის, და მასში გადავცემთ მითითბას, თუ სად უნდა გახსნას link-ში მოცემული წყარო (გამოიყენება მხოლოდ _blank)

HyperText -- ვებ-საიტები, რომლებს შორითაც შეგვიძლია მოგზაურობა HyperLink-ის მეშვეობით.

-->
