<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card-container">
    <form id="myForm" class="rating-state">
      <div class="star-icon">
        <img src="./images/icon-star.svg" alt="star" width="17"  height="16">
      </div>
<br><br>
      <h1>How did we do?</h1>
      <br>
      <p class="description">Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
<br><br> 
      <div class="rating-numbers">
        <label class="circle-label"><input type="radio" name="rating" value="1"> 1</label>
        <label class="circle-label"><input type="radio" name="rating" value="2"> 2</label>
        <label class="circle-label"><input type="radio" name="rating" value="3"> 3</label>
        <label class="circle-label"><input type="radio" name="rating" value="4"> 4</label>
        <label class="circle-label"><input type="radio" name="rating" value="5"> 5</label>
      </div>
      <span class="error-msg" id="ratingError"></span>
<br><br>
      <button id="button" type="submit">Submit</button>
    </form>

    <div id="thankYouState" class="thank-you-state" style="display: none;">
      <div class="illustration">
        <img src="./images/illustration-thank-you.svg" alt="Thank you illustration" width="162" height="108">
      </div>
      <div class="result-badge">
        You selected <span id="selectedRating">0</span> out of 5
      </div>
      <h2>Thank you!</h2>
      <p class="description center">We appreciate you taking time to give a rating. if you ever need more support, don't hesitate to get in touch!</p>
    </div>
  </main>

  <script src="script.js"></script>
  

</body>
</html>
