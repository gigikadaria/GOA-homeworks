<!--
Attributes ესაა დამატებითი ინფორმაცია ტეგებისთვის.
ისინი ეუბნებიან HTML ელემენტს როგორი იყოს ან რას აკეთებდეს.


მთავარი ატრიბუტები:
- id — უნიკალური სახელი. (optional)
- class — ჯგუფის სახელი. (optional)
- src — ფაილის მისამართი (img/script). (required)
- href — ბმულის მისამართი. (required)
- alt — სურათის აღწერა. (required)
- style — მცირე სტილი HTML–ში. (optional)
- title — ტექსტი მაუსის მიტანისას. (optional)
- width/height — ზომები. (optional)
- target — ხსნის ახალ ფანჯარაში. (optional)
- type — input/script ტიპი. (required)
-->
<!--
Single-Page:
- ყველაფერი ერთ გვერდზეა.
- სექციებზე გადასვლა ხდება #ID ბმულებით.


Multi-Page:
- თითოეულ თემას თავისი HTML ფაილი აქვს.
- გამოიყენება დიდი საიტებისთვის.
-->
