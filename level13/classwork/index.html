<html>
  <head>
    <title>Links & Lists</title>
  </head>
  <body>
    <nav>
      <a href="./about.html">About Page</a>
      <a href="./contact.html">Contact Page</a>
    </nav>

    <nav>
      <a href="#myol">About Page</a>
      <a href="#muul">Contact Page</a>
    </nav>

    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <ol id="myol">
      <li>
        <button>Click me</button>
      </li>

      <li>
        <img
          src="https://cdn-imgix.headout.com/media/images/c9db3cea62133b6a6bb70597326b4a34-388-dubai-img-worlds-of-adventure-tickets-01.jpg?auto=format&w=1222.3999999999999&h=687.6&q=90&ar=16%3A9&crop=faces&fit=crop"
          width="50"
        />
      </li>

      <li>
        <a href="https://www.imdb.com/title/tt4593060/" target="_blank"
          >Click to visit Pinocchio</a
        >
      </li>

      <li>
        <ul>
          <li>Python</li>
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
      </li>


    </ol>

    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <ul id="muul">
      <li>Python</li>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>

  </body>
</html>

<!--

ordered list - დალაგებული სია -- ol

unordered list - დაულაგებელი სია -- ul

list item - სიის ნიშვნელობა - li

round bullets


navigation - ნავიგაცია

multi-page - მრავალგვერდიანი ვებ-საიტი

single-page - ერთგვერდიანი ვებ-საიტი

<nav></nav>

id - უნიკალური ატრიბუტი, რომლიც მნიშვნელობა ყველა tag-სთვის უნდა იყოს განსხვავებული.

-->
