<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS დავალება</title>

    <style>
        /* ------------------------------
           1) div-ის სტილები
           ------------------------------
           ეს CSS წესი მოქმედებს div-ზე
           და ცვლის:
           - ტექსტის ფერს
           - უკანა ფონის ფერს
           - ტექსტს აყენებს ცენტრში
           - ზრდის ფონტის ზომას
        */
        .container {
            color: white;              /* ტექსტის ფერი */
            background-color: teal;    /* დივის უკანა ფონი */
            text-align: center;        /* ტექსტის ცენტრირება */
            font-size: 24px;           /* ფონტის ზომა */
            padding: 20px;             /* შიდა დაშორება */
        }

        /* ------------------------------
           2) Descendant selector
           ------------------------------
           Descendant selector მუშაობს ასე:
           მშობელი ელემენტის შიგნით მდებარე
           კონკრეტულ ელემენტს ვირჩევთ.

           p b ნიშნავს:
           აირჩიე ყველა <b> თეგი,
           რომელიც <p> თეგის შიგნით არის
        */
        p b {
            color: red; /* მხოლოდ p-ის შიგნით მყოფ b თეგს უცვლის ფერს */
        }
    </style>
</head>
<body>

  
    <div class="container">
        <h1>სათაური</h1>
        <p>ეს არის ტექსტი div-ის შიგნით</p>
        <button>დააჭირე</button>
    </div>

    <p>
        ეს არის ჩვეულებრივი ტექსტი და 
        <b>ეს ტექსტი იქნება წითელი</b>
    </p>

</body>
</html>
