<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Contact form</title>
</head>
<body>
  <div class="toast" id="toast">
    <strong>Message Sent!</strong>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>

  <form novalidate id="myForm">
    <h2>Contact Us</h2>

    <div class="row">
      <div class="field">
        <label for="first-name">First Name *</label>
        <input type="text" id="first-name" name="first-name">
        <span class="error-msg" id="firstNameError"></span>
      </div>
      <div class="field">
        <label for="last-name">Last Name *</label>
        <input type="text" id="last-name" name="last-name">
        <span class="error-msg" id="lastNameError"></span>
      </div>
    </div>

    <div class="field">
      <label for="email">Email address *</label>
      <input type="email" id="email" name="email">
      <span class="error-msg" id="emailError"></span>
    </div>

    <div class="field">
      <label>Query Type *</label>
      <div class="radio-group">
        <label class="radio-card">
          <input type="radio" name="query" value="general"> General Enquiry
        </label>
        <label class="radio-card">
          <input type="radio" name="query" value="support"> Support Request
        </label>
      </div>
      <span id="queryError" class="error-msg"></span>
    </div>

    <div class="field">
      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="4"></textarea>
      <span id="messageError" class="error-msg"></span>
    </div>

    <div class="field">
      <label class="checkbox-card">
        <input type="checkbox" name="consent" id="consent">
        I consent to being contacted by the team
      </label>
      <span id="consentError" class="error-msg"></span>
    </div>

    <button type="submit">Submit</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
