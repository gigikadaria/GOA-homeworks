<!DOCTYPE html>
<html>
<head>
  <style>
    /* 
      vh = viewport height
      1vh = 1% of the browser window height
      100vh = full height of the screen
    */

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 250px;
      height: 250px;

      background-color: red;
    }
  </style>
</head>
<body>
  <div class="box"></div>

</body>
</html>
