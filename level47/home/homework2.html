<!DOCTYPE html>
<html lang="en">
<head>
    <title>Colorlib Form</title>
    <link rel="stylesheet" href="homework2.css">
</head>
<body>

    <div class="box">

        <h2>Colorlib Contact Form</h2>
        <p class="sub">Contact us for custom quote</p>

        <form>

            <input type="text" placeholder="Your name">
            <input type="email" placeholder="Your Email Address">
            <input type="text" placeholder="Your Phone Number (optional)">
            <input type="text" placeholder="Your Web Site (optional)">

            <textarea placeholder="Type your message here...."></textarea>

            <button type="submit">Submit</button>

        </form>

        <p class="footer">Designed by <a href="#">Colorlib</a></p>

    </div>

</body>
</html>
