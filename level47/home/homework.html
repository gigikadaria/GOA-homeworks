<!DOCTYPE html>
<html lang="en">
<head>
    <title>Styled List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <ul class="list">

        <li>
            <span class="circle">1</span>
            List item
        </li>

        <li>
            <span class="circle">2</span>
            List item
        </li>

        <li>
            <span class="circle">3</span>
            List item
        </li>

        <li class="sub">
            <span class="circle">1</span>
            List sub item
        </li>

        <li class="sub">
            <span class="circle">2</span>
            List sub item
        </li>

    </ul>

</body>
</html>
