<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Buttons</title>
    <style>
        button {
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            border-color: rgb(12, 221, 221);
            border-radius: 5px;
        }
    </style>
</head>
<body>

<button>Normal Button</button>
<button class="special">Special Button</button>

<h1 style="color: darkblue; font-size: 36px; text-align: center; background-color: lightgray;  border: 2px solid blue;">this is an inline heading</h1>

<p style="color: darkgreen; font-size: 18px; text-align: center; background-color: #f0f8ff;  border-left: 4px dashed green;">this is an inline paragraph</p>
</body>
</html>
