<!DOCTYPE html>
<html>
<head>
    <title>CSS Values Explanation</title>

    <style>
        /* 1) red
           არის ფერის მნიშვნელობა.
           გამოიყენება color ან background-color თვისებაში.
           აძლევს ტექსტს ან ელემენტს წითელ ფერს.
        */
        .red-text {
            color: red;
        }

        /* 2) #0000FF
           არის HEX ფერის მნიშვნელობა.
           ფორმატი არის #RRGGBB.
           ეს კონკრეტულად ნიშნავს ლურჯ ფერს.
        */
        .blue-text {
            color: #0000FF;
        }

        /* 3) rgb(0, 255, 0)
           არის RGB ფერის მნიშვნელობა.
           rgb ნიშნავს Red, Green, Blue.
           რიცხვები იწერება 0-დან 255-მდე.
           ეს ნიშნავს მწვანე ფერს.
        */
        .green-text {
            color: rgb(0, 255, 0);
        }

    </style>
</head>
<body>

    <h1>CSS Values Explanation</h1>

    <p class="red-text">This text uses red value.</p>

    <p class="blue-text">This text uses HEX value (#0000FF).</p>

    <p class="green-text">This text uses RGB value (0,255,0).</p>

</body>
</html>
